name: Auto-fix TypeScript

on:
  push:
    branches:
      - feat/ui-account-invoices-reports

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix modeRow style reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(tabs)/index.tsx')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('styles.modeRow', 'styles.invoiceChoice')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(tabs)/index.tsx'
          git diff --cached --quiet || git commit -m 'fix: correct invoice mode row style [skip auto-fix]'
          git push
