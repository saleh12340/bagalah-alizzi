<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B4D36">
<title>بقالة العزي للمواد الغذائية</title>
<style>
:root{--green:#126B4A;--green2:#0B4D36;--mint:#EAF4EE;--gold:#D6A83C;--bg:#F4F7F4;--card:#fff;--text:#16352A;--muted:#718078;--line:#DDE7E1;--danger:#B43A3A;--shadow:0 8px 24px rgba(19,58,43,.08);--nav:76px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text);direction:rtl}
body{font-size:15px}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
#app{height:100dvh;min-height:100%;display:flex;flex-direction:column}
.top{flex:0 0 auto;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;box-shadow:0 3px 14px rgba(0,0,0,.12);z-index:20}
.toprow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brandmark{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.12);flex:none}
.brandtext{min-width:0}.brandtext b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandtext span{font-size:11px;opacity:.8}
.iconbtn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 12px calc(var(--nav) + var(--safe) + 24px);scroll-behavior:smooth}
.screen{display:none;max-width:760px;margin:auto}.screen.active{display:block}
.hero{background:linear-gradient(135deg,#fff,#eef7f1);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.hero h1{font-size:22px;margin:0 0 5px}.hero p{margin:0;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:21px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}
.cardtitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.cardtitle h2{font-size:16px;margin:0}.muted{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;padding:0 14px;border-radius:13px;background:var(--green);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.btn.secondary{background:var(--mint);color:var(--green)}.btn.gold{background:#F4E7C6;color:#745716}.btn.danger{background:#FCE9E9;color:var(--danger)}.btn.ghost{background:#F3F6F4;color:var(--text);border:1px solid var(--line)}
.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:700;color:#53645C;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid #CDDAD3;border-radius:12px;background:#fff;padding:9px 11px;outline:none;color:var(--text);font-size:15px}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,107,74,.10)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.full{grid-column:1/-1}
.invoicehead{display:grid;grid-template-columns:1.15fr .72fr 1.4fr .82fr 42px;gap:5px;align-items:end}.invoicehead>div{font-size:11px;color:var(--muted);font-weight:700}.invoicehead .total{font-size:13px;color:var(--green)}
.itemrow{display:grid;grid-template-columns:1.15fr .72fr 1.4fr .82fr 42px;gap:5px;align-items:center;margin-bottom:7px}.itemrow input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;background:#fff;min-width:0}.itemrow .unit{background:#F2F5F3;color:#6A7771;text-align:center}.itemrow .totalInput{font-weight:900;color:var(--green);font-size:16px}.del{height:44px;border-radius:10px;background:#FCECEC;color:var(--danger);font-size:18px}
.bigTotal{background:#0B4D36;color:#fff;border-radius:17px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin:11px 0}.bigTotal strong{font-size:23px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #EDF1EE}.row:last-child{border-bottom:0}.rowmain{min-width:0;flex:1}.rowmain b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rowmain small{color:var(--muted);display:block;margin-top:3px}.amount{font-weight:900;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--danger)}
.chip{display:inline-flex;align-items:center;padding:6px 9px;border-radius:99px;background:var(--mint);color:var(--green);font-size:11px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.nav{position:fixed;right:0;left:0;bottom:0;height:calc(var(--nav) + var(--safe));padding:7px 8px var(--safe);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:50}.nav button{background:transparent;color:#7B8982;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;min-width:0}.nav button b{font-size:20px;line-height:1}.nav button.active{color:var(--green);background:var(--mint)}
body.keyboard .nav{display:none}.keyboard .content{padding-bottom:18px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--safe) + 12px);z-index:100;background:#17382C;color:#fff;border-radius:13px;padding:12px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none}.toast.show{display:block}
.modal{position:fixed;inset:0;background:rgba(5,28,20,.45);z-index:200;display:none;align-items:flex-end;padding:0}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + var(--safe));box-shadow:0 -10px 35px rgba(0,0,0,.18)}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.close{width:40px;height:40px;border-radius:12px;background:#F2F5F3;color:var(--text);font-size:20px}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:9px}.search input{width:100%;height:45px;border:1px solid var(--line);border-radius:13px;padding:8px 12px;background:#fff}
.reportbar{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.reportbar button{min-height:38px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid var(--line);white-space:nowrap}.reportbar button.active{background:var(--green);color:#fff;border-color:var(--green)}
.notice{padding:10px 12px;border-radius:12px;background:#FFF7DF;color:#6C551A;font-size:12px;line-height:1.7;margin-bottom:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;transform:translateX(-50%);max-width:760px;border-radius:18px 18px 0 0}.content{padding-left:20px;padding-right:20px}.itemrow,.invoicehead{grid-template-columns:1.1fr .7fr 1.6fr .85fr 46px}}
@media(max-width:390px){body{font-size:14px}.brandtext b{font-size:14px}.brandmark{width:39px;height:39px}.invoicehead,.itemrow{grid-template-columns:1fr .65fr 1.15fr .72fr 38px;gap:4px}.itemrow input{font-size:13px;padding:5px 4px}.itemrow .unit{font-size:12px}.nav button{font-size:9px}.nav button b{font-size:18px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="toprow"><div class="brand"><div class="brandmark">ع</div><div class="brandtext"><b>بقالة العزي</b><span>للمواد الغذائية · إدارة المبيعات والحسابات</span></div></div><button class="iconbtn" onclick="show('settings')" aria-label="الإعدادات">⚙</button></div></header>
<main id="content" class="content"></main>
<nav class="nav" id="nav">
<button data-screen="home" onclick="show('home')"><b>⌂</b>الرئيسية</button>
<button data-screen="invoice" onclick="show('invoice')"><b>＋</b>فاتورة</button>
<button data-screen="stock" onclick="show('stock')"><b>▦</b>المخزون</button>
<button data-screen="customers" onclick="show('customers')"><b>♙</b>العملاء</button>
<button data-screen="reports" onclick="show('reports')"><b>▤</b>التقارير</button>
<button data-screen="expenses" onclick="show('expenses')"><b>−</b>المصروفات</button>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='azizi_html_v2';
const now=()=>new Date().toISOString();
const uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const money=n=>Number(n||0).toLocaleString('ar-YE',{maximumFractionDigits:2})+' ريال';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const seed={store:{name:'بقالة العزي للمواد الغذائية',phone:'776425052'},invoices:[],customers:[],products:[],expenses:[]};
let state=load(), current='home', editingId=null, reportPeriod='today';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x?{...seed,...x}:seed}catch{return seed}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),2300)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openSheet(title,body){document.getElementById('sheet').innerHTML='<div class="sheethead"><h2 style="margin:0;font-size:17px">'+esc(title)+'</h2><button class="close" onclick="closeModal()">×</button></div>'+body;document.getElementById('modal').classList.add('show')}
function show(screen){current=screen;editingId=null;render();document.getElementById('content').scrollTop=0;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen))}
function render(){const c=document.getElementById('content');c.innerHTML=['home','invoice','stock','customers','reports','expenses','settings'].includes(current)?views[current]():views.home();if(current==='customers')renderCustomers()}
const views={
home(){const sales=todaySales(), debt=state.customers.reduce((a,c)=>a+Number(c.balance||0),0), low=state.products.filter(p=>Number(p.stock||0)<=Number(p.min||0)).length;return '<section class="screen active"><div class="hero"><h1>مرحباً بك في بقالة العزي</h1><p>إدارة واضحة وسريعة للمبيعات والعملاء والمخزون والمصروفات، مع حفظ محلي دائم.</p><div class="actions" style="margin-top:12px"><button class="btn" onclick="newInvoice()">＋ فاتورة جديدة</button><button class="btn secondary" onclick="show(\'customers\')">حسابات العملاء</button></div></div><div class="grid"><div class="stat"><span class="label">مبيعات اليوم</span><strong>'+money(sales.total)+'</strong></div><div class="stat"><span class="label">فواتير اليوم</span><strong>'+sales.count+'</strong></div><div class="stat"><span class="label">ديون العملاء</span><strong>'+money(debt)+'</strong></div><div class="stat"><span class="label">تنبيهات المخزون</span><strong>'+low+'</strong></div></div><div class="card"><div class="cardtitle"><h2>آخر الفواتير</h2><button class="btn secondary" onclick="show(\'invoice\')">كل الفواتير</button></div>'+recentInvoices()+'</div><div class="card"><div class="cardtitle"><h2>اختصارات</h2></div><div class="actions"><button class="btn ghost" onclick="show(\'stock\')">المخزون</button><button class="btn ghost" onclick="show(\'expenses\')">المصروفات</button><button class="btn ghost" onclick="show(\'reports\')">التقارير</button><button class="btn ghost" onclick="show(\'settings\')">الإعدادات</button></div></div></section>'},
invoice(){return '<section class="screen active"><div class="card"><div class="cardtitle"><h2>'+ (editingId?'تعديل الفاتورة':'فاتورة بيع جديدة') +'</h2><span class="chip">حفظ محلي</span></div><div class="formgrid"><div class="field full"><label>اسم العميل (اختياري)</label><input id="customerName" list="customerList" placeholder="اكتب الاسم أو اختر عميلاً" value="'+esc(invoiceDraft.customerName)+'"><datalist id="customerList">'+state.customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist></div></div><div class="invoicehead"><div class="total">الإجمالي</div><div>الكمية</div><div>اسم الصنف</div><div>سعر الوحدة</div><div></div></div><div id="lines">'+invoiceDraft.lines.map((x,i)=>lineHtml(x,i)).join('')+'</div><div class="actions"><button class="btn secondary" onclick="addLine()">＋ إضافة صنف</button></div><div class="bigTotal"><span>إجمالي الفاتورة</span><strong id="grandTotal">'+money(grand())+'</strong></div><div class="formgrid"><div class="field"><label>المدفوع</label><input id="paid" inputmode="decimal" type="number" min="0" value="'+esc(invoiceDraft.paid||0)+'" oninput="invoiceDraft.paid=this.value"></div><div class="field"><label>الباقي على العميل</label><input id="due" readonly value="'+money(Math.max(0,grand()-Number(invoiceDraft.paid||0)))+'"></div></div><div class="actions"><button class="btn" onclick="saveInvoice()">حفظ الفاتورة</button><button class="btn gold" onclick="printCurrent()">طباعة</button><button class="btn secondary" onclick="shareCurrent()">مشاركة PDF</button><button class="btn ghost" onclick="show(\'home\')">إلغاء</button></div></div><div class="card"><div class="cardtitle"><h2>الفواتير المحفوظة</h2></div>'+invoiceList()+'</div></section>'},
stock(){const low=state.products.filter(p=>Number(p.stock||0)<=Number(p.min||0));return '<section class="screen active"><div class="card"><div class="cardtitle"><h2>المخزون والأصناف</h2><button class="btn" onclick="productForm()">＋ صنف</button></div>'+(low.length?'<div class="notice">تنبيه: يوجد '+low.length+' صنف عند الحد الأدنى أو أقل.</div>':'')+(state.products.length?state.products.map(p=>'<div class="row"><div class="rowmain"><b>'+esc(p.name)+'</b><small>المخزون: '+Number(p.stock||0)+' · الحد الأدنى: '+Number(p.min||0)+' · السعر: '+money(p.price)+'</small></div><span class="chip">'+(Number(p.stock||0)<=Number(p.min||0)?'منخفض':'متوفر')+'</span><button class="btn danger" style="min-height:38px;padding:0 9px" onclick="deleteProduct(\''+p.id+'\')">حذف</button></div>').join(''):'<div class="empty">لا توجد أصناف بعد.</div>')+'</div></section>'},
customers(){return '<section class="screen active"><div class="card"><div class="cardtitle"><h2>حسابات العملاء</h2><button class="btn" onclick="customerForm()">＋ عميل</button></div><div class="search"><input id="customerSearch" placeholder="بحث باسم العميل أو الهاتف" oninput="renderCustomers()"></div><div id="customerRows"></div></div></section>'},
reports(){const data=reportData(reportPeriod);return '<section class="screen active"><div class="card"><div class="cardtitle"><h2>التقارير</h2></div><div class="reportbar">'+['today','yesterday','week','month','year','all'].map((p,i)=>'<button class="'+(reportPeriod===p?'active':'')+'" onclick="reportPeriod=\''+p+'\';render()">'+['اليوم','أمس','هذا الأسبوع','هذا الشهر','هذه السنة','الكل'][i]+'</button>').join('')+'</div></div><div class="grid"><div class="stat"><span class="label">المبيعات</span><strong>'+money(data.sales)+'</strong></div><div class="stat"><span class="label">عدد الفواتير</span><strong>'+data.count+'</strong></div><div class="stat"><span class="label">المصروفات</span><strong>'+money(data.expenses)+'</strong></div><div class="stat"><span class="label">صافي الحركة</span><strong>'+money(data.sales-data.expenses)+'</strong></div></div><div class="card"><div class="row"><div class="rowmain"><b>إجمالي الديون</b></div><span class="amount negative">'+money(state.customers.reduce((a,c)=>a+Number(c.balance||0),0))+'</span></div><div class="row"><div class="rowmain"><b>الأصناف المنخفضة</b></div><span class="amount">'+state.products.filter(p=>Number(p.stock||0)<=Number(p.min||0)).length+'</span></div></div></section>'},
expenses(){return '<section class="screen active"><div class="card"><div class="cardtitle"><h2>المصروفات</h2><button class="btn" onclick="expenseForm()">＋ مصروف</button></div>'+ (state.expenses.length?state.expenses.slice().reverse().map(e=>'<div class="row"><div class="rowmain"><b>'+esc(e.title)+'</b><small>'+fmt(e.date)+' · '+esc(e.note||'')+'</small></div><span class="amount negative">-'+money(e.amount)+'</span><button class="btn danger" style="min-height:38px;padding:0 9px" onclick="deleteExpense(\''+e.id+'\')">حذف</button></div>').join(''):'<div class="empty">لا توجد مصروفات.</div>')+'</div></section>'},
settings(){return '<section class="screen active"><div class="hero"><h1>الإعدادات</h1><p>إعدادات التطبيق محلية، ولا يوجد حد وهمي لعدد العمليات.</p></div><div class="card"><div class="cardtitle"><h2>بيانات المحل</h2></div><div class="field"><label>اسم المحل</label><input id="storeName" value="'+esc(state.store.name)+'"></div><div class="field"><label>الهاتف</label><input id="storePhone" inputmode="tel" value="'+esc(state.store.phone)+'"></div><button class="btn" onclick="saveSettings()">حفظ البيانات</button></div><div class="card"><div class="cardtitle"><h2>البيانات والنسخ الاحتياطي</h2></div><div class="actions"><button class="btn secondary" onclick="nativeBackup()">مشاركة نسخة احتياطية</button><button class="btn gold" onclick="resetData()">إعادة البيانات التجريبية</button></div><p class="muted" style="font-size:12px;margin:10px 0 0">البيانات محفوظة داخل الجهاز. احتفظ بنسخة احتياطية قبل حذف التطبيق.</p></div><div class="card"><div class="cardtitle"><h2>الطباعة والمشاركة</h2></div><p class="muted" style="line-height:1.8;margin:0">زر الطباعة يرسل الفاتورة إلى خدمة الطباعة الأصلية في Android، وزر المشاركة ينشئ PDF ثم يفتح قائمة المشاركة النظامية.</p></div></section>'}
};
let invoiceDraft={customerName:'',paid:0,lines:[{description:'',quantity:1,total:0}]};
function newInvoice(){editingId=null;invoiceDraft={customerName:'',paid:0,lines:[{description:'',quantity:1,total:0}]};show('invoice')}
function lineHtml(x,i){const unit=Number(x.quantity||0)?Number(x.total||0)/Number(x.quantity||1):0;return '<div class="itemrow"><input class="totalInput" inputmode="decimal" type="number" value="'+esc(x.total||'')+'" placeholder="0" onfocus="this.select()" oninput="setLine('+i+',\'total\',this.value)"><input inputmode="decimal" type="number" min="0.01" step="any" value="'+esc(x.quantity||1)+'" onfocus="this.select()" oninput="setLine('+i+',\'quantity\',this.value)"><input value="'+esc(x.description||'')+'" placeholder="اسم الصنف" oninput="setLine('+i+',\'description\',this.value)"><input class="unit" readonly value="'+(unit?money(unit):'—')+'"><button class="del" onclick="removeLine('+i+')">×</button></div>'}
function setLine(i,k,v){invoiceDraft.lines[i][k]=k==='description'?v:Number(v||0);if(k==='quantity'&&invoiceDraft.lines[i].quantity<=0)invoiceDraft.lines[i].quantity=1;document.getElementById('lines').innerHTML=invoiceDraft.lines.map(lineHtml).join('');document.getElementById('grandTotal').textContent=money(grand());const due=document.getElementById('due');if(due)due.value=money(Math.max(0,grand()-Number(invoiceDraft.paid||0)))}
function addLine(){invoiceDraft.lines.push({description:'',quantity:1,total:0});render()}
function removeLine(i){if(invoiceDraft.lines.length===1)return toast('يجب إبقاء بند واحد على الأقل');invoiceDraft.lines.splice(i,1);render()}
function grand(){return invoiceDraft.lines.reduce((a,x)=>a+Number(x.total||0),0)}
function saveInvoice(){invoiceDraft.customerName=document.getElementById('customerName')?.value.trim()||'';invoiceDraft.paid=Number(document.getElementById('paid')?.value||0);const lines=invoiceDraft.lines.filter(x=>x.description.trim()&&Number(x.total)>0&&Number(x.quantity)>0);if(!lines.length)return toast('أضف بنداً واحداً على الأقل');const total=lines.reduce((a,x)=>a+Number(x.total),0);if(invoiceDraft.paid>total){invoiceDraft.paid=total;document.getElementById('paid').value=total}if(editingId){const old=state.invoices.find(i=>i.id===editingId);if(old)applyCustomer(old.customerName,-Math.max(0,Number(old.total)-Number(old.paid)))}const inv={id:editingId||uid('inv'),customerName:invoiceDraft.customerName,total,paid:Number(invoiceDraft.paid||0),due:Math.max(0,total-Number(invoiceDraft.paid||0)),lines,date:editingId?(state.invoices.find(i=>i.id===editingId)?.date||now()):now()};if(editingId)state.invoices=state.invoices.map(i=>i.id===editingId?inv:i);else state.invoices.push(inv);applyCustomer(inv.customerName,inv.due);lines.forEach(x=>{const p=state.products.find(p=>p.name.trim()===x.description.trim());if(p){p.stock=Math.max(0,Number(p.stock||0)-Number(x.quantity||0));p.price=Number(x.total||0)/Number(x.quantity||1)}});save();toast('تم حفظ الفاتورة بنجاح');show('home')}
function applyCustomer(name,delta){if(!name)return;let c=state.customers.find(c=>c.name.trim()===name.trim());if(!c){c={id:uid('cus'),name:name.trim(),phone:'',balance:0,payments:[]};state.customers.push(c)}c.balance=Number(c.balance||0)+Number(delta||0)}
function invoiceList(){return state.invoices.slice().reverse().map(i=>'<div class="row"><div class="rowmain"><b>فاتورة '+esc(i.id.slice(-5))+' · '+esc(i.customerName||'نقدي')+'</b><small>'+fmt(i.date)+' · '+i.lines.length+' أصناف</small></div><span class="amount">'+money(i.total)+'</span><button class="btn ghost" style="min-height:38px;padding:0 8px" onclick="editInvoice(\''+i.id+'\')">تعديل</button><button class="btn danger" style="min-height:38px;padding:0 8px" onclick="deleteInvoice(\''+i.id+'\')">حذف</button></div>').join('')||'<div class="empty">لا توجد فواتير.</div>'}
function recentInvoices(){return state.invoices.slice().reverse().slice(0,5).map(i=>'<div class="row"><div class="rowmain"><b>'+esc(i.customerName||'فاتورة نقدية')+'</b><small>'+fmt(i.date)+'</small></div><span class="amount">'+money(i.total)+'</span></div>').join('')||'<div class="empty">لم تُسجل فواتير بعد.</div>'}
function editInvoice(id){const i=state.invoices.find(x=>x.id===id);if(!i)return;editingId=id;invoiceDraft={customerName:i.customerName||'',paid:i.paid||0,lines:i.lines.map(x=>({...x}))};show('invoice')}
function deleteInvoice(id){const i=state.invoices.find(x=>x.id===id);if(!i)return;if(!confirm('حذف الفاتورة نهائياً؟'))return;applyCustomer(i.customerName,-Math.max(0,Number(i.total)-Number(i.paid)));state.invoices=state.invoices.filter(x=>x.id!==id);save();toast('تم حذف الفاتورة');render()}
function printCurrent(){const i={...invoiceDraft,total:grand(),paid:Number(invoiceDraft.paid||0),date:now(),customerName:document.getElementById('customerName')?.value||invoiceDraft.customerName};sendNative('print',{html:receiptHtml(i)})}
function shareCurrent(){const i={...invoiceDraft,total:grand(),paid:Number(invoiceDraft.paid||0),date:now(),customerName:document.getElementById('customerName')?.value||invoiceDraft.customerName};sendNative('sharePdf',{html:receiptHtml(i)})}
function receiptHtml(i){return '<!doctype html><html dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma,Arial,sans-serif;width:80mm;margin:0 auto;padding:8px;color:#111}h2{text-align:center;margin:0 0 5px}p{margin:4px 0;font-size:12px}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #aaa;padding:6px 0}.total{font-size:17px;font-weight:bold;margin-top:9px}</style><h2>'+esc(state.store.name)+'</h2><p style="text-align:center">'+esc(state.store.phone)+'</p><p>التاريخ: '+esc(fmt(i.date))+'</p><p>العميل: '+esc(i.customerName||'نقدي')+'</p>'+i.lines.map(x=>'<div class="line"><span>'+esc(x.description)+' × '+Number(x.quantity)+'</span><b>'+money(x.total)+'</b></div>').join('')+'<p class="total">الإجمالي: '+money(i.total)+'</p><p>المدفوع: '+money(i.paid)+'</p><p>المتبقي: '+money(Math.max(0,i.total-i.paid))+'</p><p style="text-align:center;margin-top:14px">شكراً لتعاملكم معنا</p></html>'}
function customerForm(c=null){openSheet(c?'تعديل العميل':'إضافة عميل','<div class="field"><label>اسم العميل</label><input id="cfName" value="'+esc(c?.name||'')+'"></div><div class="field"><label>رقم الهاتف</label><input id="cfPhone" inputmode="tel" value="'+esc(c?.phone||'')+'"></div><div class="actions"><button class="btn" onclick="saveCustomer(\''+(c?.id||'')+'\')">حفظ</button></div>')}
function saveCustomer(id){const name=document.getElementById('cfName').value.trim(),phone=document.getElementById('cfPhone').value.trim();if(!name)return toast('اكتب اسم العميل');if(id){const c=state.customers.find(x=>x.id===id);if(c){c.name=name;c.phone=phone}}else state.customers.push({id:uid('cus'),name,phone,balance:0,payments:[]});save();closeModal();toast('تم حفظ العميل');render()}
function renderCustomers(){const host=document.getElementById('customerRows');if(!host)return;const q=(document.getElementById('customerSearch')?.value||'').trim().toLowerCase();const arr=state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q));host.innerHTML=arr.map(c=>'<div class="row" onclick="customerDetail(\''+c.id+'\')"><div class="rowmain"><b>'+esc(c.name)+'</b><small>'+esc(c.phone||'لا يوجد هاتف')+'</small></div><span class="amount '+(Number(c.balance)>0?'negative':'positive')+'">'+money(c.balance)+'</span></div>').join('')||'<div class="empty">لا توجد حسابات عملاء.</div>'}
function customerDetail(id){const c=state.customers.find(x=>x.id===id);if(!c)return;const ops=[...state.invoices.filter(i=>i.customerName===c.name).map(i=>({date:i.date,text:'فاتورة',amount:i.due})),...(c.payments||[]).map(p=>({date:p.date,text:p.note||'دفعة',amount:-Number(p.amount)}))].sort((a,b)=>new Date(b.date)-new Date(a.date));openSheet(c.name,'<div class="grid"><div class="stat"><span class="label">الرصيد الحالي</span><strong class="'+(Number(c.balance)>0?'negative':'positive')+'">'+money(c.balance)+'</strong></div><div class="stat"><span class="label">الهاتف</span><strong style="font-size:15px">'+esc(c.phone||'—')+'</strong></div></div><div class="actions"><button class="btn" onclick="paymentForm(\''+c.id+'\')">＋ تسجيل دفعة</button>'+(c.phone?'<button class="btn secondary" onclick="nativeCall(\''+esc(c.phone)+'\')">اتصال</button><button class="btn gold" onclick="nativeWhatsApp(\''+esc(c.phone)+'\',\''+encodeURIComponent(statementText(c))+'\')">واتساب</button>':'')+'<button class="btn ghost" onclick="editCustomerFromDetail(\''+c.id+'\')">تعديل</button><button class="btn danger" onclick="deleteCustomer(\''+c.id+'\')">حذف الحساب</button></div><div class="card" style="box-shadow:none;margin-top:12px"><div class="cardtitle"><h2>كشف الحساب</h2></div>'+(ops.length?ops.map(o=>'<div class="row"><div class="rowmain"><b>'+esc(o.text)+'</b><small>'+fmt(o.date)+'</small></div><span class="amount '+(o.amount>0?'negative':'positive')+'">'+(o.amount>0?'+':'')+money(o.amount)+'</span></div>').join(''):'<div class="empty">لا توجد حركات.</div>')+'</div>')}
function statementText(c){return 'كشف حساب '+c.name+'\nالرصيد: '+money(c.balance)+'\n'+state.invoices.filter(i=>i.customerName===c.name).map(i=>fmt(i.date)+' فاتورة '+money(i.due)).join('\n')}
function editCustomerFromDetail(id){closeModal();const c=state.customers.find(x=>x.id===id);customerForm(c)}
function paymentForm(id){openSheet('تسجيل دفعة','<div class="field"><label>المبلغ</label><input id="payAmount" inputmode="decimal" type="number" min="0.01"></div><div class="field"><label>التفاصيل</label><input id="payNote" placeholder="مثلاً: دفعة نقدية"></div><button class="btn" onclick="savePayment(\''+id+'\')">حفظ الدفعة</button>')}
function savePayment(id){const c=state.customers.find(x=>x.id===id),a=Number(document.getElementById('payAmount').value||0),note=document.getElementById('payNote').value.trim();if(!c||a<=0)return toast('أدخل مبلغاً صحيحاً');c.balance=Math.max(0,Number(c.balance||0)-a);c.payments=c.payments||[];c.payments.push({id:uid('pay'),amount:a,note,date:now()});save();closeModal();toast('تم تسجيل الدفعة');customerDetail(id)}
function deleteCustomer(id){const c=state.customers.find(x=>x.id===id);if(!c||!confirm('حذف حساب العميل بالكامل؟'))return;state.customers=state.customers.filter(x=>x.id!==id);save();closeModal();toast('تم حذف حساب العميل');render()}
function productForm(){openSheet('إضافة صنف','<div class="field"><label>اسم الصنف</label><input id="pfName"></div><div class="formgrid"><div class="field"><label>الكمية</label><input id="pfStock" inputmode="decimal" type="number" value="0"></div><div class="field"><label>الحد الأدنى</label><input id="pfMin" inputmode="decimal" type="number" value="0"></div><div class="field full"><label>سعر البيع</label><input id="pfPrice" inputmode="decimal" type="number" value="0"></div></div><button class="btn" onclick="saveProduct()">حفظ الصنف</button>')}
function saveProduct(){const name=document.getElementById('pfName').value.trim(),stock=Number(document.getElementById('pfStock').value||0),min=Number(document.getElementById('pfMin').value||0),price=Number(document.getElementById('pfPrice').value||0);if(!name)return toast('اكتب اسم الصنف');if(state.products.some(p=>p.name.trim()===name))return toast('الصنف موجود بالفعل');state.products.push({id:uid('prd'),name,stock,min,price});save();closeModal();toast('تمت إضافة الصنف');render()}
function deleteProduct(id){if(!confirm('حذف الصنف؟'))return;state.products=state.products.filter(p=>p.id!==id);save();toast('تم حذف الصنف');render()}
function expenseForm(){openSheet('إضافة مصروف','<div class="field"><label>اسم المصروف</label><input id="efTitle" placeholder="مثلاً: نقل"></div><div class="field"><label>المبلغ</label><input id="efAmount" inputmode="decimal" type="number" min="0.01"></div><div class="field"><label>التفاصيل</label><input id="efNote"></div><button class="btn" onclick="saveExpense()">حفظ المصروف</button>')}
function saveExpense(){const title=document.getElementById('efTitle').value.trim(),amount=Number(document.getElementById('efAmount').value||0),note=document.getElementById('efNote').value.trim();if(!title||amount<=0)return toast('أدخل البيانات كاملة');state.expenses.push({id:uid('exp'),title,amount,note,date:now()});save();closeModal();toast('تم حفظ المصروف');render()}
function deleteExpense(id){if(!confirm('حذف المصروف؟'))return;state.expenses=state.expenses.filter(e=>e.id!==id);save();toast('تم الحذف');render()}
function saveSettings(){state.store.name=document.getElementById('storeName').value.trim()||'بقالة العزي للمواد الغذائية';state.store.phone=document.getElementById('storePhone').value.trim();save();toast('تم حفظ بيانات المحل');document.querySelector('.brandtext b').textContent='بقالة العزي';}
function todaySales(){const d=new Date(),key=d.toDateString();return state.invoices.filter(i=>new Date(i.date).toDateString()===key).reduce((a,i)=>{a.total+=Number(i.total);a.count++;return a},{total:0,count:0})}
function reportData(period){const end=new Date(),start=new Date(end);if(period==='today'){start.setHours(0,0,0,0)}else if(period==='yesterday'){start.setDate(start.getDate()-1);start.setHours(0,0,0,0);end.setDate(end.getDate()-1);end.setHours(23,59,59,999)}else if(period==='week'){start.setDate(start.getDate()-6);start.setHours(0,0,0,0)}else if(period==='month'){start.setDate(1);start.setHours(0,0,0,0)}else if(period==='year'){start.setMonth(0,1);start.setHours(0,0,0,0)}else return {sales:state.invoices.reduce((a,i)=>a+Number(i.total),0),count:state.invoices.length,expenses:state.expenses.reduce((a,e)=>a+Number(e.amount),0)};const inv=state.invoices.filter(i=>{const d=new Date(i.date);return d>=start&&d<=end}),ex=state.expenses.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end});return {sales:inv.reduce((a,i)=>a+Number(i.total),0),count:inv.length,expenses:ex.reduce((a,e)=>a+Number(e.amount),0)}}
function fmt(d){return new Date(d).toLocaleString('ar-YE',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function nativeCall(phone){sendNative('call',{phone})}
function nativeWhatsApp(phone,text){sendNative('whatsapp',{phone,text:decodeURIComponent(text)})}
function nativeBackup(){sendNative('backup',{data:JSON.stringify(state,null,2)})}
function sendNative(type,data){if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type,...data}))}
function resetData(){if(!confirm('سيتم حذف البيانات الحالية وإعادة البداية. هل أنت متأكد؟'))return;state=JSON.parse(JSON.stringify(seed));save();toast('تمت إعادة البيانات');show('home')}
window.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select')){document.body.classList.add('keyboard');setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),180)}});
window.addEventListener('focusout',()=>setTimeout(()=>{if(!document.querySelector(':focus'))document.body.classList.remove('keyboard')},250));
if(window.visualViewport){const vv=window.visualViewport;const resize=()=>{document.documentElement.style.setProperty('--vh',vv.height+'px')};vv.addEventListener('resize',resize);resize()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const inputs=[...document.querySelectorAll('input,select,textarea')],i=inputs.indexOf(e.target);if(i>=0&&inputs[i+1]){e.preventDefault();inputs[i+1].focus()}}});
show('home');
</script>
</body>
</html>
