<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B4D36">
<title>بقالة العزي للمواد الغذائية</title>
<style>
:root{--g:#126B4A;--g2:#0B4D36;--mint:#EAF4EE;--gold:#D6A83C;--bg:#F4F7F4;--card:#fff;--txt:#16352A;--muted:#718078;--line:#DDE7E1;--red:#B43A3A;--shadow:0 7px 22px rgba(19,58,43,.08);--nav:74px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif}body{font-size:14px}button,input,select,textarea{font:inherit}button{border:0}#app{height:100dvh;display:flex;flex-direction:column}.top{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 13px 10px;z-index:20}.toprow{display:flex;align-items:center;gap:9px}.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}.mark{width:41px;height:41px;border-radius:13px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:900;font-size:19px}.brand b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{opacity:.8;font-size:10px}.icon{width:41px;height:41px;border-radius:12px;background:#ffffff1c;color:#fff;font-size:20px}.content{flex:1;overflow:auto;min-height:0;padding:13px 11px calc(var(--nav) + var(--safe) + 20px)}.screen{display:none;max-width:780px;margin:auto}.screen.active{display:block}.hero,.card,.stat{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:21px;padding:17px;margin-bottom:11px;background:linear-gradient(135deg,#fff,#eef7f1)}.hero h1{font-size:21px;margin:0 0 5px}.hero p{margin:0;line-height:1.7;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:11px}.stat{border-radius:16px;padding:12px;min-width:0}.stat label{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:6px;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card{border-radius:17px;padding:13px;margin-bottom:11px}.title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.title h2{font-size:15px;margin:0}.muted{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{min-height:43px;padding:0 13px;border-radius:12px;background:var(--g);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn.sec{background:var(--mint);color:var(--g)}.btn.gold{background:#F5E8C8;color:#735716}.btn.ghost{background:#F2F5F3;color:var(--txt);border:1px solid var(--line)}.btn.danger{background:#FCEAEA;color:var(--red)}.btn.sm{min-height:36px;padding:0 9px;font-size:12px}.field{margin-bottom:9px}.field label{display:block;font-size:11px;font-weight:700;color:#53645C;margin:0 0 4px}.field input,.field select,.field textarea,.search input{width:100%;min-height:45px;border:1px solid #CDDAD3;border-radius:11px;background:#fff;padding:8px 10px;outline:0;color:var(--txt)}.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:var(--g);box-shadow:0 0 0 3px #126b4a1a}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.full{grid-column:1/-1}.search{margin-bottom:9px}.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #EDF1EE}.row:last-child{border-bottom:0}.main{flex:1;min-width:0}.main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main small{display:block;color:var(--muted);margin-top:3px}.amount{font-weight:900;white-space:nowrap}.red{color:var(--red)}.green{color:var(--g)}.empty{text-align:center;color:var(--muted);padding:25px 8px}.chip{display:inline-flex;padding:5px 8px;border-radius:99px;background:var(--mint);color:var(--g);font-size:10px;font-weight:700}.notice{background:#FFF7DF;color:#6C551A;border-radius:11px;padding:9px 11px;line-height:1.6;margin-bottom:9px;font-size:11px}.nav{position:fixed;z-index:50;right:0;left:0;bottom:0;height:calc(var(--nav) + var(--safe));padding:6px 6px var(--safe);background:#fffffff7;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);backdrop-filter:blur(10px)}.nav button{background:transparent;color:#7B8982;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px}.nav button b{font-size:19px}.nav button.active{background:var(--mint);color:var(--g)}body.keyboard .nav{display:none}body.keyboard .content{padding-bottom:16px}.toast{display:none;position:fixed;z-index:300;left:12px;right:12px;bottom:calc(var(--nav) + var(--safe) + 10px);background:#17382C;color:#fff;padding:11px;border-radius:12px;text-align:center}.toast.show{display:block}.modal{position:fixed;inset:0;background:#051c1473;z-index:200;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-height:93dvh;overflow:auto;background:#fff;border-radius:21px 21px 0 0;padding:15px 13px calc(17px + var(--safe));box-shadow:0 -10px 35px #0002}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.close{width:39px;height:39px;border-radius:11px;background:#F2F5F3;font-size:20px;color:var(--txt)}.reportbar{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.reportbar button{white-space:nowrap;min-height:37px;padding:0 11px;border-radius:10px;background:#fff;border:1px solid var(--line)}.reportbar button.active{background:var(--g);color:#fff}.invoice-entry{background:#F7FAF8;border:1px solid var(--line);border-radius:15px;padding:10px}.entrygrid{display:grid;grid-template-columns:1fr .72fr 1.45fr;gap:7px;align-items:end}.entrygrid .total input{font-size:18px;font-weight:900;color:var(--g)}.addentry{width:100%;margin-top:7px}.table{overflow:auto}.thead,.trow{display:grid;grid-template-columns:1.05fr .62fr 1.45fr .82fr 38px;gap:5px;min-width:470px;align-items:center}.thead{font-size:10px;color:var(--muted);font-weight:700;padding:8px 0}.trow{margin-bottom:6px}.trow input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;min-width:0}.trow .unit{background:#F2F5F3;color:#6A7771;text-align:center}.trow .lineTotal{font-weight:900;color:var(--g);font-size:15px}.del{height:42px;border-radius:9px;background:#FCEAEA;color:var(--red);font-size:17px}.big{display:flex;justify-content:space-between;align-items:center;background:var(--g2);color:#fff;border-radius:15px;padding:12px 14px;margin:10px 0}.big strong{font-size:22px}.mini-actions{display:flex;gap:5px;flex-wrap:wrap}.kpi{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1ee}.kpi:last-child{border:0}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;transform:translateX(-50%);max-width:780px;border-radius:17px 17px 0 0}.content{padding-left:20px;padding-right:20px}}@media(max-width:390px){.entrygrid{grid-template-columns:.9fr .65fr 1.2fr}.btn{padding:0 10px}.thead,.trow{grid-template-columns:1fr .58fr 1.15fr .72fr 35px}.trow input{font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="toprow"><div class="brand"><div class="mark">ع</div><div style="min-width:0"><b id="brandName">بقالة العزي</b><small>للمواد الغذائية · مبيعات وحسابات ومخزون</small></div></div><button class="icon" onclick="show('settings')">⚙</button></div></header>
<main id="content" class="content"></main>
<nav class="nav">
<button data-s="home" onclick="show('home')"><b>⌂</b>الرئيسية</button>
<button data-s="invoice" onclick="newInvoice()"><b>＋</b>فاتورة</button>
<button data-s="stock" onclick="show('stock')"><b>▦</b>المخزون</button>
<button data-s="customers" onclick="show('customers')"><b>♙</b>العملاء</button>
<button data-s="reports" onclick="show('reports')"><b>▤</b>التقارير</button>
<button data-s="more" onclick="show('more')"><b>☷</b>المزيد</button>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='azizi_clean_v3';
const seed={store:{name:'بقالة العزي للمواد الغذائية',phone:'776425052'},invoices:[],purchases:[],customers:[],suppliers:[],products:[],expenses:[],notes:[]};
let state=load(),current='home',editingId=null,invoiceDraft=null,reportPeriod='today';
const uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const num=v=>Number(v||0);
const money=v=>num(v).toLocaleString('ar-YE',{maximumFractionDigits:2})+' ريال';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>new Date(d).toLocaleString('ar-YE',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const hijri=d=>new Date(d).toLocaleDateString('ar-SA-u-ca-islamic',{year:'numeric',month:'long',day:'numeric'});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x?merge(seed,x):JSON.parse(JSON.stringify(seed))}catch{return JSON.parse(JSON.stringify(seed))}}
function merge(a,b){const x=JSON.parse(JSON.stringify(a));Object.keys(b||{}).forEach(k=>x[k]=b[k]);x.store={...a.store,...(b.store||{})};return x}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2200)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function sheet(title,body){document.getElementById('sheet').innerHTML='<div class="sheethead"><h2 style="margin:0;font-size:17px">'+esc(title)+'</h2><button class="close" onclick="closeModal()">×</button></div>'+body;document.getElementById('modal').classList.add('show')}
function show(s){current=s;editingId=null;render();document.getElementById('content').scrollTop=0;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===s||(s==='more'&&b.dataset.s==='more')))}
function render(){const v=views[current]||views.more;document.getElementById('content').innerHTML=v();if(current==='customers')filterCustomers();if(current==='stock')filterStock()}
function newInvoice(){editingId=null;invoiceDraft={customerName:'',paid:0,lines:[]};show('invoice');setTimeout(()=>document.getElementById('customerName')?.focus(),100)}
function grand(){return (invoiceDraft?.lines||[]).reduce((a,x)=>a+num(x.total),0)}
const views={
home(){const sales=todaySales(),debt=state.customers.reduce((a,c)=>a+num(c.balance),0),low=state.products.filter(p=>num(p.stock)<=num(p.min)).length;return '<section class="screen active"><div class="hero"><h1>مرحباً بك في بقالة العزي</h1><p>نظام محلي لإدارة المبيعات والحسابات والمخزون والمصروفات والموردين، مع حفظ البيانات على الجهاز.</p><div class="actions" style="margin-top:11px"><button class="btn" onclick="newInvoice()">＋ فاتورة بيع</button><button class="btn sec" onclick="show(\'customers\')">حسابات العملاء</button></div></div><div class="grid"><div class="stat"><label>مبيعات اليوم</label><strong>'+money(sales.total)+'</strong></div><div class="stat"><label>فواتير اليوم</label><strong>'+sales.count+'</strong></div><div class="stat"><label>ديون العملاء</label><strong class="red">'+money(debt)+'</strong></div><div class="stat"><label>تنبيهات المخزون</label><strong>'+low+'</strong></div></div><div class="card"><div class="title"><h2>آخر الفواتير</h2><button class="btn sm sec" onclick="show(\'invoice\')">كل الفواتير</button></div>'+invoiceRows(5)+'</div><div class="card"><div class="title"><h2>الوصول السريع</h2></div><div class="actions"><button class="btn ghost" onclick="show(\'stock\')">الأصناف</button><button class="btn ghost" onclick="show(\'purchases\')">المشتريات</button><button class="btn ghost" onclick="show(\'suppliers\')">الموردون</button><button class="btn ghost" onclick="show(\'reports\')">التقارير</button><button class="btn ghost" onclick="show(\'expenses\')">المصروفات</button><button class="btn ghost" onclick="show(\'notes\')">الملاحظات</button></div></div></section>'},
invoice(){if(!invoiceDraft)invoiceDraft={customerName:'',paid:0,lines:[]};return '<section class="screen active"><div class="card"><div class="title"><h2>'+(editingId?'تعديل الفاتورة':'فاتورة بيع جديدة')+'</h2><span class="chip">'+(editingId?'تعديل':'جديدة')+'</span></div><div class="field"><label>اسم العميل</label><input id="customerName" list="customerList" value="'+esc(invoiceDraft.customerName)+'" placeholder="اكتب اسم العميل أو اتركه نقدي"><datalist id="customerList">'+state.customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist></div><div class="invoice-entry"><div class="title"><h2>إضافة بند للفاتورة</h2><span class="muted">الإجمالي ثم الكمية ثم الصنف</span></div><div class="entrygrid"><div class="field total"><label>الإجمالي</label><input id="entryTotal" type="number" inputmode="decimal" min="0" placeholder="0"></div><div class="field"><label>العدد / الكمية</label><input id="entryQty" type="number" inputmode="decimal" min="0.01" value="1"></div><div class="field"><label>اسم الصنف أو التفاصيل</label><input id="entryDesc" list="productList" placeholder="اسم الصنف"><datalist id="productList">'+state.products.map(p=>'<option value="'+esc(p.name)+'">').join('')+'</datalist></div></div><button class="btn addentry" onclick="addEntryLine()">＋ إضافة إلى الفاتورة</button></div><div class="title" style="margin-top:12px"><h2>بنود الفاتورة</h2><span class="muted">'+invoiceDraft.lines.length+' بند</span></div><div class="table"><div class="thead"><span>الإجمالي</span><span>العدد</span><span>التفاصيل</span><span>سعر الواحدة</span><span>حذف</span></div>'+lineRows()+'</div><div class="big"><span>الإجمالي</span><strong id="grandTotal">'+money(grand())+'</strong></div><div class="formgrid"><div class="field"><label>المبلغ المسلم</label><input id="paid" type="number" inputmode="decimal" min="0" value="'+num(invoiceDraft.paid)+'" oninput="invoiceDraft.paid=num(this.value);updateInvoiceTotal()"></div><div class="field"><label>المتبقي</label><input id="due" readonly value="'+money(Math.max(0,grand()-num(invoiceDraft.paid)))+'"></div></div><div class="actions"><button class="btn" onclick="saveInvoice()">حفظ الفاتورة</button><button class="btn sec" onclick="printCurrent()">طباعة</button><button class="btn gold" onclick="shareCurrent()">مشاركة PDF</button><button class="btn ghost" onclick="show(\'home\')">إلغاء</button></div></div><div class="card"><div class="title"><h2>الفواتير المحفوظة</h2></div>'+invoiceRows()+'</div></section>'},
stock(){return '<section class="screen active"><div class="card"><div class="title"><h2>المخزون والأصناف</h2><button class="btn sm" onclick="productForm()">＋ صنف</button></div><div class="search"><input id="stockSearch" oninput="filterStock()" placeholder="بحث عن صنف"></div><div id="stockRows"></div></div></section>'},
customers(){return '<section class="screen active"><div class="card"><div class="title"><h2>حسابات العملاء</h2><button class="btn sm" onclick="customerForm()">＋ عميل</button></div><div class="search"><input id="customerSearch" oninput="filterCustomers()" placeholder="بحث بالاسم أو الهاتف"></div><div id="customerRows"></div></div></section>'},
purchases(){return '<section class="screen active"><div class="card"><div class="title"><h2>فواتير المشتريات</h2><button class="btn sm" onclick="purchaseForm()">＋ شراء</button></div>'+purchaseRows()+'</div></section>'},
suppliers(){return '<section class="screen active"><div class="card"><div class="title"><h2>الموردون</h2><button class="btn sm" onclick="supplierForm()">＋ مورد</button></div>'+supplierRows()+'</div></section>'},
expenses(){return '<section class="screen active"><div class="card"><div class="title"><h2>المصروفات</h2><button class="btn sm" onclick="expenseForm()">＋ مصروف</button></div>'+expenseRows()+'</div></section>'},
notes(){return '<section class="screen active"><div class="card"><div class="title"><h2>الملاحظات</h2><button class="btn sm" onclick="noteForm()">＋ ملاحظة</button></div>'+noteRows()+'</div></section>'},
reports(){const d=reportData(reportPeriod);return '<section class="screen active"><div class="card"><div class="title"><h2>التقارير</h2><span class="muted">حسب الفترة</span></div><div class="reportbar">'+[['today','اليوم'],['yesterday','أمس'],['week','7 أيام'],['month','هذا الشهر'],['year','هذا العام'],['all','الكل']].map(x=>'<button class="'+(reportPeriod===x[0]?'active':'')+'" onclick="reportPeriod=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div><div class="grid"><div class="stat"><label>إجمالي المبيعات</label><strong>'+money(d.sales)+'</strong></div><div class="stat"><label>عدد الفواتير</label><strong>'+d.count+'</strong></div><div class="stat"><label>المصروفات</label><strong class="red">'+money(d.expenses)+'</strong></div><div class="stat"><label>صافي الحركة</label><strong class="green">'+money(d.sales-d.expenses)+'</strong></div></div><div class="kpi"><span>إجمالي المدفوعات من العملاء</span><b>'+money(d.payments)+'</b></div><div class="kpi"><span>المبالغ الآجلة في الفواتير</span><b>'+money(d.credit)+'</b></div><div class="kpi"><span>قيمة المشتريات</span><b>'+money(d.purchases)+'</b></div><div class="kpi"><span>أصناف تحت الحد الأدنى</span><b>'+d.low+'</b></div></div><div class="card"><div class="title"><h2>تفصيل الفترة</h2><button class="btn sm gold" onclick="customReport()">فترة مخصصة</button></div>'+reportDetail(d)+'</div></section>'},
settings(){return '<section class="screen active"><div class="card"><div class="title"><h2>الإعدادات</h2></div><div class="field"><label>اسم المحل</label><input id="storeName" value="'+esc(state.store.name)+'"></div><div class="field"><label>رقم الجوال</label><input id="storePhone" inputmode="tel" value="'+esc(state.store.phone)+'"></div><button class="btn" onclick="saveSettings()">حفظ بيانات المحل</button></div><div class="card"><div class="title"><h2>النسخ الاحتياطي والاستعادة</h2></div><div class="notice">النسخة الاحتياطية تحفظ العملاء والفواتير والمشتريات والمخزون والمصروفات والملاحظات والإعدادات.</div><div class="actions"><button class="btn sec" onclick="nativeBackup()">تصدير نسخة JSON</button><button class="btn ghost" onclick="document.getElementById('restoreFile').click()">استعادة نسخة</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this)"></div></div><div class="card"><div class="title"><h2>الطباعة والمشاركة</h2></div><p class="muted" style="line-height:1.8">الفاتورة تطبع بتنسيق نصي مناسب للطابعات الحرارية 80mm، والمشاركة PDF تتم عبر نظام Android.</p></div><div class="card"><div class="title"><h2>إعادة البيانات</h2></div><button class="btn danger" onclick="resetData()">حذف بيانات التطبيق وإعادة البداية</button></div></section>'},
more(){return '<section class="screen active"><div class="hero"><h1>المزيد</h1><p>إدارة المشتريات والموردين والمصروفات والملاحظات والإعدادات.</p></div><div class="grid"><button class="stat" onclick="show(\'purchases\')"><label>المشتريات</label><strong>▣</strong></button><button class="stat" onclick="show(\'suppliers\')"><label>الموردون</label><strong>♙</strong></button><button class="stat" onclick="show(\'expenses\')"><label>المصروفات</label><strong>−</strong></button><button class="stat" onclick="show(\'notes\')"><label>الملاحظات</label><strong>✎</strong></button><button class="stat" onclick="show(\'settings\')"><label>الإعدادات</label><strong>⚙</strong></button></div></section>'}
};
function lineRows(){if(!invoiceDraft.lines.length)return '<div class="empty">لم تضف بنوداً بعد.</div>';return invoiceDraft.lines.map((x,i)=>'<div class="trow"><input class="lineTotal" type="number" inputmode="decimal" value="'+num(x.total)+'" oninput="invoiceDraft.lines['+i+'].total=num(this.value);updateInvoiceTotal()"><input type="number" inputmode="decimal" min="0.01" value="'+num(x.quantity)+'" oninput="invoiceDraft.lines['+i+'].quantity=num(this.value);updateInvoiceTotal()"><input value="'+esc(x.description)+'" oninput="invoiceDraft.lines['+i+'].description=this.value"><input class="unit" readonly value="'+(num(x.quantity)?(num(x.total)/num(x.quantity)).toLocaleString('ar-YE',{maximumFractionDigits:2}):'0')+'"><button class="del" onclick="removeLine('+i+')">×</button></div>').join('')}
function updateInvoiceTotal(){const g=grand();const e=document.getElementById('grandTotal');if(e)e.textContent=money(g);const d=document.getElementById('due');if(d)d.value=money(Math.max(0,g-num(invoiceDraft.paid)));document.querySelectorAll('.trow').forEach((r,i)=>{const u=r.querySelector('.unit');if(u)u.value=num(invoiceDraft.lines[i].quantity)?(num(invoiceDraft.lines[i].total)/num(invoiceDraft.lines[i].quantity)).toLocaleString('ar-YE',{maximumFractionDigits:2}):'0'})}
function addEntryLine(){const desc=document.getElementById('entryDesc')?.value.trim(),total=num(document.getElementById('entryTotal')?.value),qty=num(document.getElementById('entryQty')?.value);if(!desc)return toast('اكتب اسم الصنف أو التفاصيل');if(total<=0||qty<=0)return toast('أدخل الإجمالي والكمية بشكل صحيح');const d=invoiceDraft.lines.find(x=>x.description.trim()===desc);if(d){d.quantity+=qty;d.total+=total}else invoiceDraft.lines.push({description:desc,quantity:qty,total});document.getElementById('entryDesc').value='';document.getElementById('entryTotal').value='';document.getElementById('entryQty').value='1';render()}
function removeLine(i){invoiceDraft.lines.splice(i,1);render()}
function saveInvoice(){invoiceDraft.customerName=document.getElementById('customerName')?.value.trim()||'';invoiceDraft.paid=num(document.getElementById('paid')?.value);const lines=invoiceDraft.lines.filter(x=>x.description.trim()&&num(x.quantity)>0&&num(x.total)>0);if(!lines.length)return toast('أضف بنداً واحداً على الأقل');const total=lines.reduce((a,x)=>a+num(x.total),0),paid=Math.min(num(invoiceDraft.paid),total);if(editingId){const old=state.invoices.find(i=>i.id===editingId);if(old){applyCustomer(old.customerName,-Math.max(0,num(old.total)-num(old.paid)));restoreStockFromInvoice(old)}}const inv={id:editingId||uid('inv'),customerName:invoiceDraft.customerName,total,paid,due:total-paid,lines:lines.map(x=>({...x})),date:editingId?(state.invoices.find(i=>i.id===editingId)?.date||now()):now()};if(editingId)state.invoices=state.invoices.map(i=>i.id===editingId?inv:i);else state.invoices.push(inv);applyCustomer(inv.customerName,inv.due);decreaseStock(inv);save();toast('تم حفظ الفاتورة');show('home')}
function applyCustomer(name,delta){if(!name)return;let c=state.customers.find(x=>x.name.trim()===name.trim());if(!c){c={id:uid('cus'),name:name.trim(),phone:'',balance:0,payments:[],transactions:[]};state.customers.push(c)}c.balance=num(c.balance)+delta}
function decreaseStock(i){i.lines.forEach(x=>{const p=state.products.find(p=>p.name.trim()===x.description.trim());if(p){p.stock=Math.max(0,num(p.stock)-num(x.quantity));p.price=num(x.total)/num(x.quantity)}})}
function restoreStockFromInvoice(i){i.lines.forEach(x=>{const p=state.products.find(p=>p.name.trim()===x.description.trim());if(p)p.stock=num(p.stock)+num(x.quantity)})}
function invoiceRows(limit){const arr=state.invoices.slice().reverse().slice(0,limit||999);return arr.map(i=>'<div class="row"><div class="main"><b>'+esc(i.customerName||'فاتورة نقدية')+'</b><small>'+fmt(i.date)+' · '+i.lines.length+' بنود · '+(i.due>0?'متبقي '+money(i.due):'مدفوعة')+'</small></div><span class="amount">'+money(i.total)+'</span><div class="mini-actions"><button class="btn sm ghost" onclick="editInvoice(\''+i.id+'\')">تعديل</button><button class="btn sm danger" onclick="deleteInvoice(\''+i.id+'\')">حذف</button></div></div>').join('')||'<div class="empty">لا توجد فواتير.</div>'}
function editInvoice(id){const i=state.invoices.find(x=>x.id===id);if(!i)return;editingId=id;invoiceDraft={customerName:i.customerName||'',paid:i.paid||0,lines:i.lines.map(x=>({...x}))};show('invoice')}
function deleteInvoice(id){const i=state.invoices.find(x=>x.id===id);if(!i||!confirm('حذف الفاتورة نهائياً؟'))return;restoreStockFromInvoice(i);applyCustomer(i.customerName,-Math.max(0,num(i.total)-num(i.paid)));state.invoices=state.invoices.filter(x=>x.id!==id);save();toast('تم حذف الفاتورة');render()}
function receiptHtml(i){return '<!doctype html><html dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma,Arial,sans-serif;width:80mm;margin:0 auto;padding:7px;color:#111}h2{text-align:center;margin:0 0 4px}p{font-size:12px;margin:4px 0}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #aaa;padding:6px 0}.total{font-size:17px;font-weight:bold}</style><h2>'+esc(state.store.name)+'</h2><p style="text-align:center">'+esc(state.store.phone)+'</p><p>التاريخ: '+esc(fmt(i.date))+'</p><p>العميل: '+esc(i.customerName||'نقدي')+'</p>'+i.lines.map(x=>'<div class="line"><span>'+esc(x.description)+' × '+num(x.quantity)+'</span><b>'+money(x.total)+'</b></div>').join('')+'<p class="total">الإجمالي: '+money(i.total)+'</p><p>المدفوع: '+money(i.paid)+'</p><p>المتبقي: '+money(Math.max(0,i.total-i.paid))+'</p><p style="text-align:center">شكراً لتعاملكم معنا</p></html>'}
function printCurrent(){const i={...invoiceDraft,total:grand(),paid:num(invoiceDraft.paid),date:now(),customerName:document.getElementById('customerName')?.value||invoiceDraft.customerName};sendNative('print',{html:receiptHtml(i)})}
function shareCurrent(){const i={...invoiceDraft,total:grand(),paid:num(invoiceDraft.paid),date:now(),customerName:document.getElementById('customerName')?.value||invoiceDraft.customerName};sendNative('sharePdf',{html:receiptHtml(i)})}
function filterCustomers(){const h=document.getElementById('customerRows');if(!h)return;const q=(document.getElementById('customerSearch')?.value||'').toLowerCase();h.innerHTML=state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)).map(c=>'<div class="row" onclick="customerDetail(\''+c.id+'\')"><div class="main"><b>'+esc(c.name)+'</b><small>'+esc(c.phone||'لا يوجد هاتف')+'</small></div><span class="amount '+(num(c.balance)>0?'red':'green')+'">'+money(c.balance)+'</span></div>').join('')||'<div class="empty">لا توجد حسابات عملاء.</div>'}
function customerForm(c=null){sheet(c?'تعديل العميل':'إضافة عميل','<div class="field"><label>اسم العميل</label><input id="cfName" value="'+esc(c?.name||'')+'"></div><div class="field"><label>رقم الجوال</label><input id="cfPhone" inputmode="tel" value="'+esc(c?.phone||'')+'"></div><button class="btn" onclick="saveCustomer(\''+(c?.id||'')+'\')">حفظ</button>')}
function saveCustomer(id){const name=document.getElementById('cfName').value.trim(),phone=document.getElementById('cfPhone').value.trim();if(!name)return toast('اكتب اسم العميل');if(id){const c=state.customers.find(x=>x.id===id);if(c){c.name=name;c.phone=phone}}else state.customers.push({id:uid('cus'),name,phone,balance:0,payments:[],transactions:[]});save();closeModal();toast('تم حفظ العميل');render()}
function customerDetail(id){const c=state.customers.find(x=>x.id===id);if(!c)return;const ops=[...state.invoices.filter(i=>i.customerName===c.name).map(i=>({id:i.id,date:i.date,text:'فاتورة بيع',amount:i.due,type:'invoice'})),...(c.payments||[]).map(p=>({id:p.id,date:p.date,text:p.note||'دفعة',amount:-num(p.amount),type:'payment'}))].sort((a,b)=>new Date(b.date)-new Date(a.date));sheet(c.name,'<div class="grid"><div class="stat"><label>الرصيد الحالي</label><strong class="'+(num(c.balance)>0?'red':'green')+'">'+money(c.balance)+'</strong></div><div class="stat"><label>الهاتف</label><strong style="font-size:14px">'+esc(c.phone||'—')+'</strong></div></div><div class="actions"><button class="btn" onclick="paymentForm(\''+id+'\')">＋ تسجيل دفعة</button>'+(c.phone?'<button class="btn sec" onclick="nativeCall(\''+esc(c.phone)+'\')">اتصال</button><button class="btn gold" onclick="nativeWhatsApp(\''+esc(c.phone)+'\',\''+encodeURIComponent(statementText(c))+'\')">واتساب</button>':'')+'<button class="btn ghost" onclick="editCustomer(\''+id+'\')">تعديل</button><button class="btn danger" onclick="deleteCustomer(\''+id+'\')">حذف الحساب</button></div><div class="card" style="margin-top:10px;box-shadow:none"><div class="title"><h2>كشف الحساب</h2><button class="btn sm gold" onclick="shareStatement(\''+id+'\')">مشاركة PDF</button></div>'+ (ops.length?ops.map(o=>'<div class="row"><div class="main"><b>'+esc(o.text)+'</b><small>'+fmt(o.date)+'</small></div><span class="amount '+(o.amount>0?'red':'green')+'">'+(o.amount>0?'+':'')+money(o.amount)+'</span>'+(o.type==='payment'?'<button class="btn sm danger" onclick="deletePayment(\''+id+'\',\''+o.id+'\')">حذف</button>':'')+'</div>').join(''):'<div class="empty">لا توجد حركات.</div>')+'</div>')}
function paymentForm(id){sheet('تسجيل دفعة','<div class="field"><label>المبلغ</label><input id="payAmount" type="number" inputmode="decimal" min="0.01"></div><div class="field"><label>التفاصيل</label><input id="payNote" placeholder="دفعة نقدية"></div><button class="btn" onclick="savePayment(\''+id+'\')">حفظ الدفعة</button>')}
function savePayment(id){const c=state.customers.find(x=>x.id===id),a=num(document.getElementById('payAmount').value),note=document.getElementById('payNote').value.trim();if(!c||a<=0)return toast('أدخل مبلغاً صحيحاً');c.balance=Math.max(0,num(c.balance)-a);c.payments=c.payments||[];c.payments.push({id:uid('pay'),amount:a,note,date:now()});save();closeModal();customerDetail(id)}
function deletePayment(cid,pid){const c=state.customers.find(x=>x.id===cid);if(!c||!confirm('حذف الدفعة؟'))return;const p=c.payments.find(x=>x.id===pid);if(p)c.balance=num(c.balance)+num(p.amount);c.payments=c.payments.filter(x=>x.id!==pid);save();customerDetail(cid)}
function editCustomer(id){closeModal();customerForm(state.customers.find(x=>x.id===id))}
function deleteCustomer(id){if(!confirm('حذف حساب العميل بالكامل؟'))return;state.customers=state.customers.filter(x=>x.id!==id);save();closeModal();render()}
function statementText(c){return 'كشف حساب '+c.name+'\nالرصيد الحالي: '+money(c.balance)+'\n'+state.invoices.filter(i=>i.customerName===c.name).map(i=>fmt(i.date)+' فاتورة '+money(i.due)).join('\n')}
function shareStatement(id){const c=state.customers.find(x=>x.id===id);if(c)sendNative('sharePdf',{html:statementHtml(c)})}
function statementHtml(c){return '<!doctype html><html dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma;width:80mm;padding:7px}h2{text-align:center}.r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #aaa}</style><h2>كشف حساب</h2><p>العميل: '+esc(c.name)+'</p><p>التاريخ: '+fmt(now())+'</p>'+state.invoices.filter(i=>i.customerName===c.name).map(i=>'<div class="r"><span>'+fmt(i.date)+'</span><b>'+money(i.due)+'</b></div>').join('')+'<p><b>الرصيد: '+money(c.balance)+'</b></p></html>'}
function filterStock(){const h=document.getElementById('stockRows');if(!h)return;const q=(document.getElementById('stockSearch')?.value||'').toLowerCase();h.innerHTML=state.products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>'<div class="row"><div class="main"><b>'+esc(p.name)+'</b><small>الكمية: '+num(p.stock)+' · الحد الأدنى: '+num(p.min)+' · السعر: '+money(p.price)+'</small></div><span class="chip '+(num(p.stock)<=num(p.min)?'red':'')+'">'+(num(p.stock)<=num(p.min)?'منخفض':'متوفر')+'</span><div class="mini-actions"><button class="btn sm ghost" onclick="productForm(state.products.find(x=>x.id===\''+p.id+'\'))">تعديل</button><button class="btn sm danger" onclick="deleteProduct(\''+p.id+'\')">حذف</button></div></div>').join('')||'<div class="empty">لا توجد أصناف.</div>'}
function productForm(p=null){sheet(p?'تعديل الصنف':'إضافة صنف','<div class="field"><label>اسم الصنف</label><input id="pfName" value="'+esc(p?.name||'')+'"></div><div class="formgrid"><div class="field"><label>الكمية</label><input id="pfStock" type="number" inputmode="decimal" value="'+num(p?.stock)+'"></div><div class="field"><label>الحد الأدنى</label><input id="pfMin" type="number" inputmode="decimal" value="'+num(p?.min)+'"></div><div class="field full"><label>سعر البيع</label><input id="pfPrice" type="number" inputmode="decimal" value="'+num(p?.price)+'"></div></div><button class="btn" onclick="saveProduct(\''+(p?.id||'')+'\')">حفظ الصنف</button>')}
function saveProduct(id){const name=document.getElementById('pfName').value.trim(),stock=num(document.getElementById('pfStock').value),min=num(document.getElementById('pfMin').value),price=num(document.getElementById('pfPrice').value);if(!name)return toast('اكتب اسم الصنف');if(state.products.some(p=>p.name.trim()===name&&p.id!==id))return toast('الصنف موجود بالفعل');if(id){const p=state.products.find(x=>x.id===id);Object.assign(p,{name,stock,min,price})}else state.products.push({id:uid('prd'),name,stock,min,price});save();closeModal();toast('تم حفظ الصنف');render()}
function deleteProduct(id){if(!confirm('حذف الصنف؟'))return;state.products=state.products.filter(x=>x.id!==id);save();render()}
function purchaseRows(){return state.purchases.slice().reverse().map(p=>'<div class="row"><div class="main"><b>'+esc(p.supplier||'مورد غير محدد')+'</b><small>'+fmt(p.date)+' · '+p.lines.length+' أصناف</small></div><span class="amount">'+money(p.total)+'</span><button class="btn sm danger" onclick="deletePurchase(\''+p.id+'\')">حذف</button></div>').join('')||'<div class="empty">لا توجد مشتريات.</div>'}
function purchaseForm(){sheet('فاتورة شراء','<div class="field"><label>اسم المورد</label><input id="buySupplier" list="supplierList"><datalist id="supplierList">'+state.suppliers.map(s=>'<option value="'+esc(s.name)+'">').join('')+'</datalist></div><div class="field"><label>اسم الصنف</label><input id="buyName"></div><div class="formgrid"><div class="field"><label>الكمية</label><input id="buyQty" type="number" inputmode="decimal" value="1"></div><div class="field"><label>الإجمالي</label><input id="buyTotal" type="number" inputmode="decimal"></div></div><div class="notice">يمكن إضافة عدة أصناف في فاتورة شراء واحدة. بعد الحفظ تزيد الكميات في المخزون.</div><button class="btn" onclick="savePurchase()">حفظ فاتورة الشراء</button>')}
function savePurchase(){const supplier=document.getElementById('buySupplier').value.trim(),name=document.getElementById('buyName').value.trim(),qty=num(document.getElementById('buyQty').value),total=num(document.getElementById('buyTotal').value);if(!name||qty<=0||total<=0)return toast('أدخل بيانات الشراء');state.purchases.push({id:uid('pur'),supplier,total,lines:[{name,quantity:qty,total}],date:now()});let p=state.products.find(x=>x.name.trim()===name);if(!p){p={id:uid('prd'),name,stock:0,min:0,price:total/qty};state.products.push(p)}p.stock=num(p.stock)+qty;p.price=total/qty;if(supplier&&!state.suppliers.some(s=>s.name===supplier))state.suppliers.push({id:uid('sup'),name:supplier,phone:''});save();closeModal();toast('تم حفظ المشتريات وتحديث المخزون');render()}
function deletePurchase(id){const p=state.purchases.find(x=>x.id===id);if(!p||!confirm('حذف فاتورة الشراء؟'))return;p.lines.forEach(x=>{const pr=state.products.find(y=>y.name===x.name);if(pr)pr.stock=Math.max(0,num(pr.stock)-num(x.quantity))});state.purchases=state.purchases.filter(x=>x.id!==id);save();render()}
function supplierRows(){return state.suppliers.map(s=>'<div class="row"><div class="main"><b>'+esc(s.name)+'</b><small>'+esc(s.phone||'لا يوجد هاتف')+'</small></div><div class="mini-actions"><button class="btn sm ghost" onclick="supplierForm(state.suppliers.find(x=>x.id===\''+s.id+'\'))">تعديل</button><button class="btn sm danger" onclick="deleteSupplier(\''+s.id+'\')">حذف</button></div></div>').join('')||'<div class="empty">لا يوجد موردون.</div>'}
function supplierForm(s=null){sheet(s?'تعديل المورد':'إضافة مورد','<div class="field"><label>اسم المورد</label><input id="sfName" value="'+esc(s?.name||'')+'"></div><div class="field"><label>رقم الهاتف</label><input id="sfPhone" inputmode="tel" value="'+esc(s?.phone||'')+'"></div><button class="btn" onclick="saveSupplier(\''+(s?.id||'')+'\')">حفظ</button>')}
function saveSupplier(id){const name=document.getElementById('sfName').value.trim(),phone=document.getElementById('sfPhone').value.trim();if(!name)return toast('اكتب اسم المورد');if(id)Object.assign(state.suppliers.find(x=>x.id===id),{name,phone});else state.suppliers.push({id:uid('sup'),name,phone});save();closeModal();render()}
function deleteSupplier(id){if(!confirm('حذف المورد؟'))return;state.suppliers=state.suppliers.filter(x=>x.id!==id);save();render()}
function expenseRows(){return state.expenses.slice().reverse().map(e=>'<div class="row"><div class="main"><b>'+esc(e.title)+'</b><small>'+fmt(e.date)+' · '+esc(e.note||'')+'</small></div><span class="amount red">'+money(e.amount)+'</span><button class="btn sm danger" onclick="deleteExpense(\''+e.id+'\')">حذف</button></div>').join('')||'<div class="empty">لا توجد مصروفات.</div>'}
function expenseForm(){sheet('إضافة مصروف','<div class="field"><label>اسم المصروف</label><input id="efTitle" placeholder="نقل، كهرباء، إيجار..."></div><div class="field"><label>المبلغ</label><input id="efAmount" type="number" inputmode="decimal"></div><div class="field"><label>التفاصيل</label><input id="efNote"></div><button class="btn" onclick="saveExpense()">حفظ المصروف</button>')}
function saveExpense(){const title=document.getElementById('efTitle').value.trim(),amount=num(document.getElementById('efAmount').value),note=document.getElementById('efNote').value.trim();if(!title||amount<=0)return toast('أدخل البيانات كاملة');state.expenses.push({id:uid('exp'),title,amount,note,date:now()});save();closeModal();render()}
function deleteExpense(id){if(!confirm('حذف المصروف؟'))return;state.expenses=state.expenses.filter(x=>x.id!==id);save();render()}
function noteRows(){return state.notes.slice().reverse().map(n=>'<div class="row"><div class="main"><b>'+esc(n.title)+'</b><small>'+fmt(n.date)+' · '+esc(n.body)+'</small></div><button class="btn sm danger" onclick="deleteNote(\''+n.id+'\')">حذف</button></div>').join('')||'<div class="empty">لا توجد ملاحظات.</div>'}
function noteForm(){sheet('إضافة ملاحظة','<div class="field"><label>العنوان</label><input id="nfTitle"></div><div class="field"><label>الملاحظة</label><textarea id="nfBody"></textarea></div><button class="btn" onclick="saveNote()">حفظ الملاحظة</button>')}
function saveNote(){const title=document.getElementById('nfTitle').value.trim(),body=document.getElementById('nfBody').value.trim();if(!title)return toast('اكتب عنوان الملاحظة');state.notes.push({id:uid('note'),title,body,date:now()});save();closeModal();render()}
function deleteNote(id){if(!confirm('حذف الملاحظة؟'))return;state.notes=state.notes.filter(x=>x.id!==id);save();render()}
function todaySales(){const k=new Date().toDateString();return state.invoices.filter(i=>new Date(i.date).toDateString()===k).reduce((a,i)=>(a.total+=num(i.total),a.count++,a),{total:0,count:0})}
function reportData(period){const end=new Date(),start=new Date(end);if(period==='today')start.setHours(0,0,0,0);else if(period==='yesterday'){start.setDate(start.getDate()-1);start.setHours(0,0,0,0);end.setDate(end.getDate()-1);end.setHours(23,59,59,999)}else if(period==='week'){start.setDate(start.getDate()-6);start.setHours(0,0,0,0)}else if(period==='month'){start.setDate(1);start.setHours(0,0,0,0)}else if(period==='year'){start.setMonth(0,1);start.setHours(0,0,0,0)}else return calcRange(null,null);return calcRange(start,end)}
function calcRange(start,end){const inRange=x=>!start||(new Date(x)>=start&&new Date(x)<=end);const inv=state.invoices.filter(x=>inRange(x.date)),ex=state.expenses.filter(x=>inRange(x.date)),pur=state.purchases.filter(x=>inRange(x.date)),pay=state.customers.flatMap(c=>c.payments||[]).filter(x=>inRange(x.date));return {sales:inv.reduce((a,x)=>a+num(x.total),0),count:inv.length,expenses:ex.reduce((a,x)=>a+num(x.amount),0),purchases:pur.reduce((a,x)=>a+num(x.total),0),payments:pay.reduce((a,x)=>a+num(x.amount),0),credit:inv.reduce((a,x)=>a+num(x.due),0),low:state.products.filter(x=>num(x.stock)<=num(x.min)).length,inv}}
function reportDetail(d){return d.inv.slice().reverse().slice(0,12).map(i=>'<div class="row"><div class="main"><b>'+esc(i.customerName||'فاتورة نقدية')+'</b><small>'+fmt(i.date)+'</small></div><span class="amount">'+money(i.total)+'</span></div>').join('')||'<div class="empty">لا توجد عمليات في الفترة.</div>'}
function customReport(){sheet('تقرير بفترة مخصصة','<div class="formgrid"><div class="field"><label>من</label><input id="rFrom" type="date"></div><div class="field"><label>إلى</label><input id="rTo" type="date"></div></div><button class="btn" onclick="runCustomReport()">عرض التقرير</button>')}
function runCustomReport(){const a=document.getElementById('rFrom').value,b=document.getElementById('rTo').value;if(!a||!b)return toast('حدد التاريخين');const s=new Date(a+'T00:00:00'),e=new Date(b+'T23:59:59');const d=calcRange(s,e);closeModal();sheet('نتيجة التقرير','<div class="grid"><div class="stat"><label>المبيعات</label><strong>'+money(d.sales)+'</strong></div><div class="stat"><label>المصروفات</label><strong>'+money(d.expenses)+'</strong></div><div class="stat"><label>المشتريات</label><strong>'+money(d.purchases)+'</strong></div><div class="stat"><label>الصافي</label><strong>'+money(d.sales-d.expenses)+'</strong></div></div>'+reportDetail(d))}
function saveSettings(){state.store.name=document.getElementById('storeName').value.trim()||seed.store.name;state.store.phone=document.getElementById('storePhone').value.trim();save();document.getElementById('brandName').textContent=state.store.name.replace(' للمواد الغذائية','');toast('تم حفظ بيانات المحل')}
function nativeCall(phone){sendNative('call',{phone})}
function nativeWhatsApp(phone,text){sendNative('whatsapp',{phone,text:decodeURIComponent(text)})}
function nativeBackup(){sendNative('backup',{data:JSON.stringify(state,null,2)})}
function sendNative(type,data){if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type,...data}));else toast('هذه الوظيفة تعمل داخل تطبيق Android')}
function restoreFile(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.store||!Array.isArray(x.invoices))throw 0;state=merge(seed,x);save();toast('تمت استعادة النسخة الاحتياطية');render()}catch{toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
function resetData(){if(!confirm('سيتم حذف كل البيانات المحلية. هل أنت متأكد؟'))return;state=JSON.parse(JSON.stringify(seed));save();toast('تمت إعادة البيانات');show('home')}
window.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select')){document.body.classList.add('keyboard');setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),160)}})
window.addEventListener('focusout',()=>setTimeout(()=>{if(!document.querySelector(':focus'))document.body.classList.remove('keyboard')},250))
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const a=[...document.querySelectorAll('input,select,textarea')],i=a.indexOf(e.target);if(i>=0&&a[i+1]){e.preventDefault();a[i+1].focus()}}})
document.getElementById('brandName').textContent=state.store.name.replace(' للمواد الغذائية','');
show('home');
</script>
</body></html>
